services:
  web:
    build: .
    ports:
      - "8080:80"
    restart: always
    volumes:
      - .:/var/www/html
      - /dev/null:/var/www/html/.env.local
    depends_on:
      - db
  db:
    image: mariadb:12.0
    container_name: parkoo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/parkoo.sql:/docker-entrypoint-initdb.d/parkoo.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: parkoo-pma
    restart: always
    ports:
      - "8081:80"
  mongo:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DB: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    ports:
      - "27017:27017"
volumes:
  db_data:
  mongo_data:
