services:
  web:
    build: .
    ports:
      - "8080:80"
    restart: always
    volumes:
      - .:/var/www/html
      - /dev/null:/var/www/html/.env.local
    depends_on:
      - db
  db:
    image: mariadb:10.4
    container_name: parkoo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/parkoo.sql:/docker-entrypoint-initdb.d/parkoo.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: parkoo-pma
    restart: always
    ports:
      - "8081:80"
volumes:
  db_data:
